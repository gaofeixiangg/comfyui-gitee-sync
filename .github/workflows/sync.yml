name: Sync ComfyUI to Gitee

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch all branches and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune --force
      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add gitee "https://flying_high:${GITEE_TOKEN}@gitee.com/flying_high/ComfyUI.git"
          git push gitee 'refs/remotes/origin/*:refs/heads/*' --force
          git push gitee --tags --force
